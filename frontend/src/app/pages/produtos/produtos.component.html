<div class="produtos-page">
  <div class="page-head">
    <div>
      <p class="eyebrow">Izzy Store</p>
      <h1>Peças curadas para o seu dia</h1>
      <p class="sub">Básicos sofisticados em paleta bege, pensados para durar.</p>
    </div>
    <div class="filters">
      <button class="chip active">Tudo</button>
      <button class="chip">Novidades</button>
      <button class="chip">Best sellers</button>
    </div>
  </div>

  <div *ngIf="loading" class="skeleton-grid">
    <div class="skeleton-card" *ngFor="let _ of [1,2,3,4,5,6]"></div>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="grid" *ngIf="!loading && !error">
    <div class="card" *ngFor="let produto of produtos">
      <div class="image-wrapper">
        <img [src]="produto.imagem || 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab'" [alt]="produto.nome">
        <span class="pill" *ngIf="produto.categoria">{{ produto.categoria }}</span>
      </div>

      <div class="card-content">
        <h3>{{ produto.nome }}</h3>
        <p class="descricao">{{ produto.descricao }}</p>
        <div class="price-row">
          <span class="preco">R$ {{ produto.preco | number:'1.2-2' }}</span>
          <button (click)="addAoCarrinho(produto)">Adicionar</button>
        </div>
      </div>

    </div>
  </div>
</div>
